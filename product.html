<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova | Товар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

   
    <header class="top-header">
        <div class="header-inner">
            <a href="index.html" class="logo text-decoration-none mb-0">
                <span class="logo-text">Tech</span><span class="logo-highlight">Nova</span>
            </a>
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Пошук товарів...">
                <button class="search-btn" onclick="searchProducts()">Знайти</button>
            </div>
            <div class="header-right">
                <a href="#" class="header-link">Мова: UA</a>
                <a href="#" class="header-link" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
                    Кошик 🛒 <span id="cartCount" class="badge-count">0</span>
                </a>
                <a href="#" class="header-link">Увійти</a>
            </div>
        </div>
    </header>

    
    <nav class="category-nav">
        <div class="container">
            <ul class="category-list">
                <li class="category-item"><a href="index.html">Головна</a></li>
            </ul>
        </div>
    </nav>

   
    <main class="main-bg py-5">
        <div class="container" id="product-container">
            <h2 class="text-center">Завантаження...</h2>
        </div>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cart.js"></script>
    <script src="product.js"></script>
    <script>
        function searchProducts() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = `catalog.html?search=${encodeURIComponent(query)}`;
            }
        }
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') searchProducts();
            });
        }
    </script>
</body>
</html>
