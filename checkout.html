<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova | Оформлення замовлення</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header class="top-header">
        <div class="header-inner justify-content-center">
            <a href="index.html" class="logo text-decoration-none mb-0">
                <span class="logo-text">Tech</span><span class="logo-highlight">Nova</span>
            </a>
        </div>
    </header>

    
    <main class="main-bg py-5">
        <div class="container">
            <div class="row">
                
                <div class="col-lg-7">
                    <h3 class="fw-bold mb-4 text-dark">Оформлення замовлення</h3>
                    
                    <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
                        <h5 class="fw-bold mb-3">1. Контактна інформація</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <input type="text" class="form-control" placeholder="Ім'я">
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control" placeholder="Прізвище">
                            </div>
                            <div class="col-md-6">
                                <input type="tel" class="form-control" placeholder="Номер телефону">
                            </div>
                            <div class="col-md-6">
                                <input type="email" class="form-control" placeholder="E-mail">
                            </div>
                            <div class="col-12 mt-3">
                                <input type="text" class="form-control" placeholder="Адреса доставки (Місто, відділення Нової Пошти або вулиця)">
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
                        <h5 class="fw-bold mb-3">2. Спосіб доставки</h5>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="delivery" id="novaPoshta" checked>
                            <label class="form-check-label ms-2" for="novaPoshta">Нова Пошта (Відділення)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="delivery" id="courier">
                            <label class="form-check-label ms-2" for="courier">Кур'єр на адресу</label>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
                        <h5 class="fw-bold mb-3">3. Спосіб оплати</h5>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="payment" id="card" checked>
                            <label class="form-check-label ms-2" for="card">Оплата карткою онлайн</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="payment" id="cash">
                            <label class="form-check-label ms-2" for="cash">Післяплата (при отриманні)</label>
                        </div>
                    </div>
                </div>

                
                <div class="col-lg-5">
                    <div class="bg-white p-4 rounded-4 shadow-sm" style="position: sticky; top: 20px;">
                        <h4 class="fw-bold mb-4">Ваше замовлення</h4>
                        
                        <div id="checkout-items" class="mb-4">
                           
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Сума:</span>
                            <span id="checkout-subtotal" class="fw-bold">0 ₴</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Доставка:</span>
                            <span class="text-success">За тарифами перевізника</span>
                        </div>
                        
                        <hr>
                        
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fw-bold fs-5">До сплати:</span>
                            <span id="checkout-total" class="fw-bold fs-4 text-dark">0 ₴</span>
                        </div>

                        <button class="btn btn-warning w-100 fw-bold py-3 fs-5 rounded-3" onclick="completeOrder()">
                            ПІДТВЕРДИТИ ЗАМОВЛЕННЯ
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="checkout.js"></script>
</body>
</html>
